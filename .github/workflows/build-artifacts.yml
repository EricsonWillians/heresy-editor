name: Build, test, and publish artifacts

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: heresy-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  CTEST_PARALLEL_LEVEL: 2

jobs:
  linux:
    name: Linux / ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86_64 GCC
            runner: ubuntu-24.04
            architecture: x86_64
            cc: gcc
            cxx: g++
            publish: true
          - label: x86_64 Clang
            runner: ubuntu-24.04
            architecture: x86_64
            cc: clang
            cxx: clang++
            publish: false
          - label: arm64 GCC
            runner: ubuntu-24.04-arm
            architecture: arm64
            cc: gcc
            cxx: g++
            publish: true

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            clang cmake g++ libgl-dev libglu1-mesa-dev libjpeg-dev \
            libpng-dev libxpm-dev libz-dev ninja-build python3

      - name: Build and test
        run: >-
          ./build.sh --clean --type Release --test --jobs 2
          --cc "${{ matrix.cc }}" --cxx "${{ matrix.cxx }}"

      - name: Package portable build
        if: matrix.publish && github.event_name != 'pull_request'
        id: package
        run: |
          archive="$(./scripts/package-linux.sh build dist "${{ matrix.architecture }}")"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Publish Linux artifact
        if: matrix.publish && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: HeresyEditor-linux-${{ matrix.architecture }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  windows:
    name: Windows / ${{ matrix.label }}
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86_64
            cmake_architecture: x64
            package_architecture: x86_64
          - label: x86
            cmake_architecture: Win32
            package_architecture: x86

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Configure
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022"
          -A "${{ matrix.cmake_architecture }}"
          -DUSE_SYSTEM_FLTK=OFF -DUSE_SYSTEM_GOOGLE_TEST=OFF

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Package portable build
        if: github.event_name != 'pull_request'
        id: package
        shell: pwsh
        run: |
          $archive = ./scripts/package-windows.ps1 `
            -BuildDirectory build `
            -OutputDirectory dist `
            -Architecture "${{ matrix.package_architecture }}"
          "archive=$($archive -replace '\\', '/')" >> $env:GITHUB_OUTPUT

      - name: Publish Windows artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: HeresyEditor-windows-${{ matrix.package_architecture }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  macos:
    name: macOS / ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: macos-15-intel
          - architecture: arm64
            runner: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="${{ matrix.architecture }}"
          -DUSE_SYSTEM_FLTK=OFF -DUSE_SYSTEM_GOOGLE_TEST=OFF

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Apply ad-hoc application signature
        if: github.event_name != 'pull_request'
        run: >-
          codesign --force --deep --sign - --timestamp=none
          --entitlements osx/EurekaApp/eureka.entitlements build/heresy.app

      - name: Verify application bundle
        if: github.event_name != 'pull_request'
        run: codesign --verify --deep --strict --verbose=2 build/heresy.app

      - name: Package disk image
        if: github.event_name != 'pull_request'
        id: package
        run: |
          archive="$(./scripts/package-macos.sh build dist "${{ matrix.architecture }}")"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Publish macOS artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: HeresyEditor-macos-${{ matrix.architecture }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Validate release version
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          project_version="$(sed -nE 's/^project\(heresy-editor VERSION ([0-9.]+)\)$/\1/p' CMakeLists.txt)"
          if [[ -z "$project_version" || "$release_version" != "$project_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match project version ${project_version:-unknown}." >&2
            exit 1
          fi
          release_notes="changelogs/${release_version}.md"
          if [[ ! -f "$release_notes" ]] || \
              ! grep -Fq "# Heresy Editor ${release_version}" "$release_notes"; then
            echo "Missing or invalid release notes: $release_notes" >&2
            exit 1
          fi

      - name: Download packaged builds
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: HeresyEditor-*
          path: release-assets
          merge-multiple: true

      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          release_notes="changelogs/${release_version}.md"
          mapfile -d '' release_assets < <(
            find release-assets -maxdepth 1 -type f -print0 | sort -z
          )
          mapfile -d '' checksum_files < <(
            find release-assets -maxdepth 1 -type f -name '*.sha256' -print0 | sort -z
          )

          if (( ${#checksum_files[@]} == 0 || ${#release_assets[@]} != ${#checksum_files[@]} * 2 )); then
            echo "Expected one checksum for every release package." >&2
            exit 1
          fi

          for release_asset in "${release_assets[@]}"; do
            asset_name="${release_asset##*/}"
            if [[ "$asset_name" != "Heresy-Editor-${release_version}-"* ]]; then
              echo "Unexpected release asset version: $asset_name" >&2
              exit 1
            fi
          done

          for checksum_file in "${checksum_files[@]}"; do
            checksum_directory="${checksum_file%/*}"
            checksum_name="${checksum_file##*/}"
            (
              cd "$checksum_directory"
              sha256sum --check "$checksum_name"
            )
          done

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Heresy Editor ${release_version}" \
              --notes-file "$release_notes" \
              --latest
            gh release upload "$GITHUB_REF_NAME" "${release_assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${release_assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Heresy Editor ${release_version}" \
              --notes-file "$release_notes" \
              --latest
          fi
